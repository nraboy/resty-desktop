name: Test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        run: |
          success=false
          for i in 1 2; do
            sudo dpkg --configure -a || true
            if timeout 240 bash -c "sudo apt update && sudo apt install -y libwebkit2gtk-4.1-dev libssl-dev \
              libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils"; then
              success=true
              break
            fi
            echo "apt attempt $i failed or timed out, retrying..."
            sleep 10
          done
          if [ "$success" != true ]; then
            echo "apt install failed after all attempts" >&2
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint:all

      - name: Run frontend tests
        run: npm run test:vite

      - name: Run Rust tests
        run: npm run test:rust
